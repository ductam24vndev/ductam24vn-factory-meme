name: Build Cross-Platform App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 pygame soundfile yt-dlp beautifulsoup4 requests pillow numpy

    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        python -c "from PIL import Image; Image.open('DUCTAM24VN_TOOLS_GROUP_128x128.png').save('app_icon.ico', format='ICO')"
        pyinstaller --noconfirm --onedir --windowed --name "DUCTAM24VN_FACTORY_MEME_Win" --icon "app_icon.ico" --add-data "DUCTAM24VN_TOOLS_GROUP_128x128.png;." --collect-all pygame --collect-all soundfile sound_fx_factory.py

    - name: Build macOS App
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "DUCTAM24VN_FACTORY_MEME_Mac" --add-data "DUCTAM24VN_TOOLS_GROUP_128x128.png:." --collect-all pygame --collect-all soundfile sound_fx_factory.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: App-${{ matrix.os }}
        path: dist/
